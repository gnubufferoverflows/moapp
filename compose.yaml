services:
  mo:
    build:
      context: .
      args:
        VITE_SYNC_BASE_URL: ${VITE_SYNC_BASE_URL:-}
    ports:
      - "${MO_PORT:-8080}:8080"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - mo-data:/data
    restart: unless-stopped

volumes:
  mo-data:
